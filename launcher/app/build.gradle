plugins {
    id "com.android.application"
}

android {
    namespace "tv.naava.home"
    compileSdk 34

    defaultConfig {
        applicationId "tv.naava.home"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            // Signed with the debug key so it installs without a keystore;
            // replace with your own signing config if you publish it.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty "robolectric.graphicsMode", "NATIVE"
            systemProperty "preview.dir", "$buildDir/preview"
        }
    }
}

dependencies {
    // Test-only: renders the home screen off-device so the layout can be checked
    // without a TV. Nothing here ships in the APK.
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
}
